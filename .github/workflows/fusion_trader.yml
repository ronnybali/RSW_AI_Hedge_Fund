name: RSW AI Fusion Trader

on:
  workflow_dispatch:

jobs:
  run-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # PENTING: Izin untuk melakukan git push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run Fusion Trader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_VPS: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run python scripts/fusion_trader.py

      - name: Commit and Push Daily Bias
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_bias.json
          git commit -m "Update AI Daily Bias [skip ci]" || echo "No changes to commit"
          git push
